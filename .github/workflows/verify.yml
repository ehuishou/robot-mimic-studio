name: Verify Robot Studio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify production page in Chromium
        run: |
          PORT=5173 HOST=127.0.0.1 node deploy/server.mjs > /tmp/robot-studio.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:pose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: artifacts/
          if-no-files-found: ignore
